name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  build:
    name: Build Angular (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Securite (deps + secrets + SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Dependances npm connues vulnerables. On ne casse pas encore le build
      # (audit-level=high logge sans faire echouer) le temps de nettoyer
      # l'existant ; a durcir plus tard avec `npm audit --audit-level=high`.
      - name: npm audit
        run: npm audit --audit-level=high || true

      # Secrets commités par erreur (cles API, tokens, .env...). Binaire officiel
      # via l'image Docker (gratuit, sans licence, quel que soit le repo) plutot
      # que l'action wrapper (licence requise pour les repos d'organisation).
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-banner --redact

      # SAST : XSS, failles connues dans le code applicatif. L'action wrapper
      # officielle est deprecated ; on utilise le CLI directement.
      - name: Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config=p/ci --error || true

  docker-build:
    name: Build image Docker + scan
    needs: [lint, test, build, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build de l'image (locale, pas encore poussee)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: autentia-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnerabilites (Trivy)
        # Pinné sur un commit SHA precis (pas un tag ni @master) suite a une
        # compromission de la quasi-totalite des tags de ce repo en 2026 :
        # https://socket.dev/blog/trivy-under-attack-again-github-actions-compromise
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (seul tag non compromis)
        with:
          image-ref: autentia-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: '0' # passe a '1' plus tard pour bloquer le build sur des failles critiques
          format: table

      - name: Login Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag + push vers Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/autentia-frontend
        run: |
          docker tag autentia-frontend:ci "$DOCKERHUB_IMAGE:latest"
          docker tag autentia-frontend:ci "$DOCKERHUB_IMAGE:${{ github.sha }}"
          docker push "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:${{ github.sha }}"
