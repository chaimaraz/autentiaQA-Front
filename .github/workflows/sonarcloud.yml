name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    # `secrets` ne peut pas etre utilise dans un `if:` (job ou step) — invalide
    # tout le workflow si on essaie. A la place, le secret passe par `env:` au
    # niveau du job, et seule l'etape de scan est conditionnee sur cette env var
    # tant que SONAR_TOKEN n'est pas configure (voir sonar-project.properties).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # historique complet, requis par l'analyse SonarCloud

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run test:ci

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
