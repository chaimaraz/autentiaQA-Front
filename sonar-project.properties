# Remplacez ces deux valeurs par celles affichees par SonarCloud lors de
# l'import du projet (Add project > GitHub > choisir autentiaQA-Front).
sonar.projectKey=REPLACE_ME_PROJECT_KEY
sonar.organization=REPLACE_ME_ORG_KEY

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/coverage/**,**/dist/**
sonar.javascript.lcov.reportPaths=coverage/autentia-front/lcov.info
