<div class="sidebar">
  <!-- LOGO -->
  <div class="logo">
    <div class="logo-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="url(#logoGrad)" />
        <path d="M7 20L14 8L21 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M9.5 16H18.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6" />
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#00e5ff" />
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="logo-text">Autentia <span>QA</span></div>
  </div>

  <!-- NAV -->
  <nav class="nav">
    <ng-container *ngFor="let section of navSections()">
      <div class="nav-section">
        <div class="nav-label">{{ section.label }}</div>

        <ng-container *ngFor="let item of section.items">
          <!-- SIMPLE ITEM -->
          <ng-container *ngIf="!isGroup(item)">
            <a
              class="nav-item"
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            >
              <i class="nav-icon fa-solid {{ item.icon }}"></i>
              {{ item.label }}
              <span *ngIf="item.badge" class="nav-badge" [ngClass]="item.badgeClass">
                {{ item.badge }}
              </span>
            </a>
          </ng-container>

          <!-- GROUP ITEM -->
          <ng-container *ngIf="isGroup(item)">
            <div class="nav-group">
              <div class="nav-item-parent" [ngClass]="{ active: item.open }" (click)="toggleGroup(item)">
                <i class="nav-icon fa-solid {{ item.icon }}"></i>
                {{ item.label }}
                <span *ngIf="item.badge" class="nav-badge" [ngClass]="item.badgeClass" style="margin-right:4px">
                  {{ item.badge }}
                </span>
                <i class="nav-chevron fa-solid" [ngClass]="item.open ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
              </div>
              <div class="nav-group-children" [ngClass]="{ open: item.open }">
                <a
                  *ngFor="let child of item.children"
                  class="nav-item sub"
                  [routerLink]="child.route"
                  routerLinkActive="active"
                >
                  <i class="nav-icon fa-solid {{ child.icon }}" style="font-size:11px"></i>
                  {{ child.label }}
                </a>
              </div>
            </div>
          </ng-container>
        </ng-container>
      </div>
    </ng-container>
  </nav>

  <!-- FOOTER -->
  <div class="sidebar-footer">
    <!-- THEME TOGGLE -->
    <div class="theme-toggle-row">
      <span class="theme-toggle-label"><i class="fa-solid fa-palette"></i> Thème</span>
      <div class="theme-btn">
        <div class="theme-opt" [ngClass]="{ active: currentTheme() === 'dark' }" (click)="setTheme('dark')" title="Mode sombre"><i class="fa-solid fa-moon"></i></div>
        <div class="theme-opt" [ngClass]="{ active: currentTheme() === 'light' }" (click)="setTheme('light')" title="Mode clair"><i class="fa-solid fa-sun"></i></div>
      </div>
    </div>

    <!-- USER CARD -->
    <div class="user-card" (click)="toggleUserDropdown()">
      <div class="avatar">{{ userInitials() }}</div>
      <div class="user-info">
        <div class="user-name">{{ userName() }}</div>
        <div class="user-role">{{ userRoleLabel() }}</div>
      </div>
      <i class="fa-solid fa-ellipsis-vertical" style="color:var(--text3);font-size:16px"></i>

      <!-- DROPDOWN -->
      <div class="user-dropdown" [ngClass]="{ open: userDropdownOpen() }" (click)="$event.stopPropagation()">
        <div class="dropdown-item" (click)="goToProfile()"><i class="fa-solid fa-user"></i> Mon profil</div>
        <div class="dropdown-item" (click)="goToSettings()"><i class="fa-solid fa-gear"></i> Paramètres</div>
        <div class="dropdown-item danger" (click)="logout()"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</div>
      </div>
    </div>
  </div>
</div>
