<!-- src/app/features/scenario-data/scenario-data.component.html -->

<div class="card scenario-data-card">
  <div class="card-header">
    <div class="card-title">
      🗃️ Données du scénario
      <span class="count-label" *ngIf="variables().length > 0">({{ variables().length }})</span>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-xs" (click)="sync()" [disabled]="loading()" title="Redétecte les {{'{{placeholders}}'}} du script">
        🔁 Détecter
      </button>
      <button class="btn btn-ghost btn-xs" (click)="regenerateAll()" [disabled]="loading()" title="Régénère toutes les variables non-manuelles">
        🎲 Régénérer tout
      </button>
      <button class="btn btn-ghost btn-xs" (click)="exportJson()" [disabled]="variables().length === 0">⬇ Exporter</button>
      <label class="btn btn-ghost btn-xs" style="cursor:pointer">
        ⬆ Importer
        <input type="file" accept="application/json" style="display:none" (change)="importJson($event)">
      </label>
      <button class="btn btn-primary btn-xs" (click)="save()" [disabled]="saving() || loading()">
        {{ saving() ? '⏳ Enregistrement…' : '💾 Enregistrer' }}
      </button>
    </div>
  </div>

  <div *ngIf="error()" class="alert-error" style="margin:8px 16px">⚠ {{ error() }}</div>

  <div *ngIf="loading()" class="empty-state"><span class="spin">⟳</span> Chargement…</div>

  <div *ngIf="!loading() && variables().length === 0" class="empty-state">
    <div class="empty-icon">🗃️</div>
    <div>Aucune variable détectée.</div>
    <button class="btn btn-ghost btn-xs" style="margin-top:8px" (click)="sync()">🔁 Détecter depuis le script</button>
  </div>

  <table class="exec-table" *ngIf="!loading() && variables().length > 0">
    <thead>
      <tr>
        <th style="width:180px">Variable</th>
        <th>Valeur</th>
        <th style="width:110px">Type</th>
        <th style="width:120px">Source</th>
        <th style="width:70px"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of variables()">
        <td class="cell-mono">
          {{ v.key }}
          <span class="secret-badge" *ngIf="v.isSecret" title="Valeur sensible">🔒</span>
        </td>
        <td>
          <input
            class="form-input"
            [(ngModel)]="v.value"
            [type]="(v.isSecret && !isSecretVisible(v.id)) ? 'password' : 'text'"
          />
          <button *ngIf="v.isSecret" class="btn btn-ghost btn-xs" (click)="toggleSecretVisibility(v.id)" style="margin-left:4px">
            {{ isSecretVisible(v.id) ? '🙈' : '👁' }}
          </button>
        </td>
        <td class="cell-text">{{ v.type || 'STRING' }}</td>
        <td>
          <span class="type-badge">{{ generatorLabel(v.generator) }}</span>
        </td>
        <td class="cell-toggle">
          <button
            class="btn btn-ghost btn-xs"
            *ngIf="v.generator !== 'MANUAL'"
            [disabled]="regeneratingId() === v.id"
            (click)="regenerateOne(v)"
            title="Régénérer cette variable"
          >
            {{ regeneratingId() === v.id ? '⏳' : '🎲' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
