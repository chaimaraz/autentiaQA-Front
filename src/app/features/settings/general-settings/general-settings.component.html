<div class="settings-section-title">Paramètres généraux</div>
<div class="settings-section-sub">Informations du projet et configuration de base.</div>

<div *ngIf="loading()" class="empty-state"><i class="fa-solid fa-arrows-rotate spin"></i> Chargement...</div>
<div class="auth-alert error show" *ngIf="error()"><i class="fa-solid fa-triangle-exclamation"></i> {{ error() }}</div>
<div class="auth-alert success show" *ngIf="success()"><i class="fa-solid fa-circle-check"></i> {{ success() }}</div>

<div *ngIf="!loading() && project()">
  <div class="form-group">
    <label class="form-label" for="gs-name">Nom du projet</label>
    <input id="gs-name" class="form-input" [(ngModel)]="form.name" />
  </div>
  <div class="form-group">
    <label class="form-label" for="gs-url">URL cible</label>
    <input id="gs-url" class="form-input" [(ngModel)]="form.url" />
  </div>
  <div class="form-group">
    <label class="form-label">Framework détecté</label>
    <div class="chip-row">
      <span class="tag cyan">{{ project()!.frameworkName }}</span>
      <span class="tag" *ngFor="let t of project()!.testTypes">{{ t.label }}</span>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label" for="gs-framework">Framework de test par défaut</label>
    <select id="gs-framework" class="form-input" [(ngModel)]="form.frameworkName">
      <option value="PLAYWRIGHT">Playwright</option>
      <option value="CYPRESS">Cypress</option>
      <option value="SELENIUM">Selenium</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label" for="gs-description">Description du projet</label>
    <textarea id="gs-description" class="form-input" [(ngModel)]="form.description"></textarea>
  </div>
  <button class="btn btn-primary" [disabled]="saving()" (click)="save()">
    <i class="fa-solid" [ngClass]="saving() ? 'fa-spinner fa-spin' : 'fa-floppy-disk'"></i> {{ saving() ? 'Sauvegarde...' : 'Sauvegarder' }}
  </button>
</div>
