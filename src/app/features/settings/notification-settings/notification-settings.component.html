<div class="settings-section-title">Notifications</div>
<div class="settings-section-sub">Configurez comment l'équipe est alertée des résultats de tests.</div>

<div class="form-group">
  <label class="form-label">Email(s) de notification</label>
  <input class="form-input" [(ngModel)]="form.emails" placeholder="qa@company.com, lead@company.com" />
</div>
<div class="form-group">
  <label class="form-label">Webhook Slack</label>
  <input class="form-input" [(ngModel)]="form.slackWebhook" placeholder="https://hooks.slack.com/services/xxx" />
</div>

<div class="notif-conditions">
  <div class="notif-conditions-title">Conditions d'envoi</div>
  <div class="switch-row" *ngFor="let opt of conditions">
    <div>
      <div class="switch-label">{{ opt.label }}</div>
      <div class="switch-sub" *ngIf="opt.sub">{{ opt.sub }}</div>
    </div>
    <div class="toggle-switch" [class.on]="opt.enabled" (click)="opt.enabled = !opt.enabled"></div>
  </div>
</div>

<button class="btn btn-primary" [disabled]="saving()" (click)="save()">
  <i class="fa-solid" [ngClass]="saving() ? 'fa-spinner fa-spin' : 'fa-floppy-disk'"></i> {{ saving() ? 'Sauvegarde...' : 'Sauvegarder' }}
</button>
<div class="auth-alert success show" *ngIf="success()" style="margin-top:12px"><i class="fa-solid fa-circle-check"></i> {{ success() }}</div>
