<div class="section-title">Paramètres</div>
<div class="section-sub">Configuration globale du projet, gestion des accès et intégrations.</div>

<!-- Sélecteur de projet — la gestion des membres / config est scopée à un projet -->
<div class="form-group settings-project-picker" *ngIf="adminProjects().length > 1">
  <label class="form-label" for="settings-project-select">Projet</label>
  <select id="settings-project-select" class="form-input" [ngModel]="selectedProjectId()" (ngModelChange)="onProjectChange($event)">
    <option *ngFor="let p of adminProjects()" [value]="p.projectId">{{ p.projectName }}</option>
  </select>
</div>

<div class="empty-state" *ngIf="adminProjects().length === 0">
  Vous n'administrez aucun projet pour le moment.
</div>

<div class="settings-layout" *ngIf="adminProjects().length > 0">
  <div class="settings-sidebar">
    <div class="settings-nav-item" [class.active]="activeTab() === 'general'" (click)="setTab('general')" (keydown.enter)="setTab('general')" tabindex="0">
      <span class="settings-nav-icon"><i class="fa-solid fa-gear"></i></span> Général
    </div>
    <div class="settings-nav-item" [class.active]="activeTab() === 'users'" (click)="setTab('users')" (keydown.enter)="setTab('users')" tabindex="0">
      <span class="settings-nav-icon"><i class="fa-solid fa-users"></i></span> Utilisateurs
    </div>
    <div
      class="settings-nav-item"
      *ngIf="canManageAccessControl()"
      [class.active]="activeTab() === 'access-control'"
      (click)="setTab('access-control')"
      (keydown.enter)="setTab('access-control')"
      tabindex="0"
    >
      <span class="settings-nav-icon"><i class="fa-solid fa-lock"></i></span> Contrôle d'accès
    </div>
    <div class="settings-nav-item" [class.active]="activeTab() === 'jira'" (click)="setTab('jira')" (keydown.enter)="setTab('jira')" tabindex="0">
      <span class="settings-nav-icon"><i class="fa-solid fa-bug"></i></span> Intégration Jira
    </div>
    <div class="settings-nav-item" [class.active]="activeTab() === 'notifications'" (click)="setTab('notifications')" (keydown.enter)="setTab('notifications')" tabindex="0">
      <span class="settings-nav-icon"><i class="fa-solid fa-bell"></i></span> Notifications
    </div>
    <div
      class="settings-nav-item"
      *ngIf="isSuperAdmin()"
      [class.active]="activeTab() === 'platform-admins'"
      (click)="setTab('platform-admins')"
      (keydown.enter)="setTab('platform-admins')"
      tabindex="0"
    >
      <span class="settings-nav-icon"><i class="fa-solid fa-shield-halved"></i></span> Comptes plateforme
    </div>
    <div
      class="settings-nav-item"
      *ngIf="isSuperAdmin()"
      [class.active]="activeTab() === 'ai-provider'"
      (click)="setTab('ai-provider')"
      (keydown.enter)="setTab('ai-provider')"
      tabindex="0"
    >
      <span class="settings-nav-icon"><i class="fa-solid fa-robot"></i></span> Fournisseur IA
    </div>
  </div>

  <div class="settings-content">
    <!-- GÉNÉRAL -->
    <div class="settings-panel" [class.active]="activeTab() === 'general'">
      <app-general-settings *ngIf="activeTab() === 'general' && selectedProjectId()" [projectId]="selectedProjectId()" />
    </div>

    <!-- UTILISATEURS -->
    <div class="settings-panel" [class.active]="activeTab() === 'users'">
      <app-users-management *ngIf="activeTab() === 'users' && selectedProjectId()" [projectId]="selectedProjectId()" />
    </div>

    <!-- CONTRÔLE D'ACCÈS -->
    <div class="settings-panel" [class.active]="activeTab() === 'access-control'">
      <app-access-control *ngIf="activeTab() === 'access-control'" />
    </div>

    <!-- JIRA -->
    <div class="settings-panel" [class.active]="activeTab() === 'jira'">
      <app-jira-settings *ngIf="activeTab() === 'jira' && selectedProjectId()" [projectId]="selectedProjectId()" />
    </div>

    <!-- NOTIFICATIONS -->
    <div class="settings-panel" [class.active]="activeTab() === 'notifications'">
      <app-notification-settings *ngIf="activeTab() === 'notifications' && selectedProjectId()" [projectId]="selectedProjectId()" />
    </div>

    <!-- COMPTES PLATEFORME -->
    <div class="settings-panel" [class.active]="activeTab() === 'platform-admins'">
      <app-platform-admins *ngIf="activeTab() === 'platform-admins'" />
    </div>

    <!-- FOURNISSEUR IA -->
    <div class="settings-panel" [class.active]="activeTab() === 'ai-provider'">
      <app-ai-settings *ngIf="activeTab() === 'ai-provider' && isSuperAdmin()" />
    </div>
  </div>
</div>
